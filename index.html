<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Hold'em Multiplayer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Texas Hold'em Poker</h1>

    <!-- Lobby & Stakes Selection -->
    <div id="lobby-panel" class="panel">
      <h2>Select Stakes Table</h2>
      <div class="stakes-grid">
        <div class="stake-card selected" onclick="selectStakes(10, 20, 1000)">
          <h3>Micro Stakes</h3>
          <p>Blinds: $10 / $20</p>
          <p>Buy-in: $1,000</p>
        </div>
        <div class="stake-card" onclick="selectStakes(50, 100, 5000)">
          <h3>Mid Stakes</h3>
          <p>Blinds: $50 / $100</p>
          <p>Buy-in: $5,000</p>
        </div>
        <div class="stake-card" onclick="selectStakes(250, 500, 25000)">
          <h3>High Stakes</h3>
          <p>Blinds: $250 / $500</p>
          <p>Buy-in: $25,000</p>
        </div>
      </div>

      <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

      <div class="lobby-controls">
        <div>Your Peer ID: <strong id="my-peer-id">Connecting...</strong></div>

        <div class="input-group">
          <input type="text" id="host-id-input" placeholder="Enter Host Peer ID (for Private Room)">
          <button id="btn-join">Join Private Room</button>
        </div>

        <div style="display: flex; gap: 10px;">
          <button id="btn-create-host">Create Private Table (Host)</button>
        </div>
      </div>
    </div>

    <!-- Game Table View -->
    <div id="game-panel" class="panel" style="display: none;">
      <div class="poker-table">
        <div class="table-info">
          <span>Stakes: $<span id="lbl-small-blind">10</span>/$<span id="lbl-big-blind">20</span></span> | 
          <span>Pot: $<span id="lbl-pot">0</span></span>
        </div>

        <div class="community-cards-container">
          <h3>Community Cards</h3>
          <div id="community-cards" class="cards"></div>
        </div>

        <div id="players-container" class="players-grid"></div>
      </div>

      <!-- Action Panel -->
      <div class="action-bar">
        <div id="status-message" style="margin-right: auto; font-weight: bold;">Waiting for players...</div>
        <button id="btn-fold" disabled>Fold</button>
        <button id="btn-check-call" disabled>Check / Call</button>
        <button id="btn-raise" disabled>Raise</button>
        <input type="number" id="raise-amount" value="40" min="10" step="10" style="width: 100px;">
        <button id="btn-start-game" style="display: none;">Start Game</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
