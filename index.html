<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Hold'em Poker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="poker-table">
    <!-- Dealer / Opponent Area -->
    <div class="player-area" id="opponent-area">
      <div class="status-badge" id="opponent-status">Opponent</div>
      <div class="cards" id="opponent-cards"></div>
      <div class="chips">Chips: $<span id="opponent-chips">1000</span></div>
      <div class="bet">Bet: $<span id="opponent-bet">0</span></div>
    </div>

    <!-- Community Cards & Pot Area -->
    <div id="table-center">
      <div id="pot-container">
        <div id="pot-label">POT: $<span id="pot-amount">0</span></div>
      </div>
      <div id="community-cards"></div>
      <div id="message-board">Welcome to Texas Hold'em! Press "New Hand" to start.</div>
    </div>

    <!-- User Player Area -->
    <div class="player-area" id="player-area">
      <div class="status-badge" id="player-status">You</div>
      <div class="cards" id="player-cards"></div>
      <div class="chips">Chips: $<span id="player-chips">1000</span></div>
      <div class="bet">Bet: $<span id="player-bet">0</span></div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <button id="btn-deal" class="btn">New Hand</button>
      <button id="btn-fold" class="btn" disabled>Fold</button>
      <button id="btn-check" class="btn" disabled>Check</button>
      <button id="btn-call" class="btn" disabled>Call</button>
      <button id="btn-raise" class="btn" disabled>Raise $20</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
