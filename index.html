<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Suite - Poker & Blackjack</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f380f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .game-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .game-nav button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #205b20;
      color: white;
      border: 1px solid #4caf50;
      border-radius: 4px;
    }
    .game-nav button:hover {
      background: #2e8b57;
    }
    .bj-dashboard, .table-area, .controls-area {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .cards {
      display: flex;
      gap: 10px;
      min-height: 80px;
      margin-top: 10px;
    }
    .card {
      width: 50px;
      height: 75px;
      background: white;
      color: black;
      border-radius: 5px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-weight: bold;
    }
    .card.red { color: red; }
    .card.back {
      background: #990000;
      border: 2px solid #fff;
    }
    .bj-hand {
      border: 1px dashed #666;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
    .bj-hand.active-hand {
      border-color: #ffb703;
      background: rgba(255, 183, 3, 0.1);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Game Selector -->
  <div class="game-nav">
    <button id="nav-poker" onclick="switchGame('poker')">Texas Hold'em (Multiplayer)</button>
    <button id="nav-blackjack" onclick="switchGame('blackjack')">Single Player Blackjack</button>
  </div>

  <!-- Poker View Container -->
  <div id="poker-section">
    <h2>Texas Hold'em Poker</h2>
    <p>Paste your existing PeerJS Poker UI HTML elements inside this container.</p>
  </div>

  <!-- Blackjack View Container -->
  <div id="blackjack-section" style="display: none;">
    <div class="bj-dashboard">
      <div>Chips Balance: <span id="bj-chips">$10,000</span></div>
      <div id="bj-message" style="margin-top: 5px; font-weight: bold;">Place your bet and press Deal!</div>
    </div>

    <div class="table-area">
      <h3>Dealer's Hand</h3>
      <div id="bj-dealer-score">Dealer Shows: 0</div>
      <div id="bj-dealer-cards" class="cards"></div>

      <hr style="border-color: #205b20; margin: 15px 0;">

      <h3>Your Hands</h3>
      <div id="bj-player-hands"></div>
    </div>

    <div class="controls-area">
      <label for="bj-bet-input">Bet Amount: </label>
      <input type="number" id="bj-bet-input" value="100" min="10" step="10" style="width: 80px; padding: 5px;">
      <button id="bj-btn-deal">Deal</button>
      <button id="bj-btn-hit" disabled>Hit</button>
      <button id="bj-btn-stand" disabled>Stand</button>
      <button id="bj-btn-double" disabled>Double Down</button>
      <button id="bj-btn-split" disabled>Split</button>
      <button id="bj-btn-insurance" disabled>Insurance</button>
    </div>
  </div>

  <script>
    function switchGame(mode) {
      const pokerEl = document.getElementById('poker-section');
      const bjEl = document.getElementById('blackjack-section');

      if (pokerEl) pokerEl.style.display = (mode === 'poker') ? 'block' : 'none';
      if (bjEl) bjEl.style.display = (mode === 'blackjack') ? 'block' : 'none';
    }
  </script>
  <script src="blackjack.js"></script>
</body>
</html>
