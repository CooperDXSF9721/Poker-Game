<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Texas Hold'em</title>
  <link rel="stylesheet" href="style.css?v=7">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Main Menu / Lobby Modal -->
  <div id="lobby-modal">
    <div class="lobby-box">
      <h2>Texas Hold'em (Testing Mode)</h2>

      <div class="input-group">
        <label>Your Display Name:</label>
        <input type="text" id="player-name-input" placeholder="Enter name" value="Player">
      </div>

      <hr class="divider">

      <!-- Public Rooms Selection -->
      <div class="lobby-section">
        <h3>Public Matchmaking Tables</h3>
        <p class="sub-text">Enter any buy-in amount to join or create a table.</p>
        
        <div class="public-tier">
          <label>Low Stakes</label>
          <div class="tier-input-group">
            <input type="number" id="public-buyin-low" min="1" step="100" value="500">
            <button class="btn btn-public" data-tier="low">Play Low</button>
          </div>
        </div>

        <div class="public-tier">
          <label>Mid Stakes</label>
          <div class="tier-input-group">
            <input type="number" id="public-buyin-mid" min="1" step="500" value="2000">
            <button class="btn btn-public" data-tier="mid">Play Mid</button>
          </div>
        </div>

        <div class="public-tier">
          <label>High Stakes</label>
          <div class="tier-input-group">
            <input type="number" id="public-buyin-high" min="1" step="1000" value="5000">
            <button class="btn btn-public" data-tier="high">Play High</button>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- Custom Host Game Options -->
      <div class="lobby-section">
        <h3>Host Private Room</h3>
        
        <div class="input-group" id="buyin-input-group">
          <label id="buyin-label">Table Buy-In ($):</label>
          <input type="number" id="host-buyin-input" min="1" step="100" value="1000">
        </div>

        <button id="btn-create-room" class="btn lg">Create Private Room</button>
      </div>

      <hr class="divider">

      <!-- Private Join Options -->
      <div class="lobby-section">
        <h3>Join Private Room</h3>
        <input type="text" id="join-code-input" placeholder="Enter Room Code">
        <button id="btn-join-room" class="btn lg secondary">Join Private Room</button>
      </div>

      <div id="lobby-status"></div>
    </div>
  </div>

  <!-- Poker Table -->
  <div id="poker-table">
    <div id="table-top-bar">
      <div id="room-info-bar">
        <span>ROOM: <strong id="display-room-code">------</strong></span>
        <button id="btn-copy-code" class="btn-sm">Copy Code</button>
      </div>
      <button id="btn-leave-room" class="btn-sm danger-btn">Leave Table</button>
    </div>

    <!-- Opponents Area -->
    <div id="opponents-container"></div>

    <!-- Table Center -->
    <div id="table-center">
      <div id="pot-container">
        <div id="pot-label">POT: $<span id="pot-amount">0</span></div>
      </div>
      <div id="community-cards"></div>
      <div id="message-board">Connecting to lobby...</div>
    </div>

    <!-- Hero Player Area -->
    <div class="player-area hero-area" id="hero-area">
      <div class="status-badge" id="hero-name">You</div>
      <div class="cards" id="hero-cards"></div>
      <div class="chips">Chips: $<span id="hero-chips">0</span></div>
      <div class="bet">Bet: $<span id="hero-bet">0</span></div>
    </div>

    <!-- Game Controls -->
    <div id="controls">
      <button id="btn-deal" class="btn" disabled>Start Hand (Host Only)</button>
      <button id="btn-fold" class="btn" disabled>Fold</button>
      <button id="btn-check" class="btn" disabled>Check</button>
      <button id="btn-call" class="btn" disabled>Call</button>
      
      <div id="raise-group">
        <input type="number" id="raise-amount" min="20" step="10" value="40" />
        <button id="btn-raise" class="btn" disabled>Bet / Raise</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=7"></script>
</body>
</html>
