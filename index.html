<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Hold'em Poker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="poker-table">
    <!-- Top Row Opponents -->
    <div id="top-opponents">
      <div class="player-area" id="player-1">
        <div class="status-badge" id="name-1">Bot 1 (SB)</div>
        <div class="cards" id="cards-1"></div>
        <div class="chips">Chips: $<span id="chips-1">1000</span></div>
        <div class="bet">Bet: $<span id="bet-1">0</span></div>
      </div>

      <div class="player-area" id="player-2">
        <div class="status-badge" id="name-2">Bot 2 (BB)</div>
        <div class="cards" id="cards-2"></div>
        <div class="chips">Chips: $<span id="chips-2">1000</span></div>
        <div class="bet">Bet: $<span id="bet-2">0</span></div>
      </div>

      <div class="player-area" id="player-3">
        <div class="status-badge" id="name-3">Bot 3</div>
        <div class="cards" id="cards-3"></div>
        <div class="chips">Chips: $<span id="chips-3">1000</span></div>
        <div class="bet">Bet: $<span id="bet-3">0</span></div>
      </div>
    </div>

    <!-- Center Board -->
    <div id="table-center">
      <div id="pot-container">
        <div id="pot-label">POT: $<span id="pot-amount">0</span></div>
      </div>
      <div id="community-cards"></div>
      <div id="message-board">Press "New Hand" to deal!</div>
    </div>

    <!-- Hero Player Area -->
    <div class="player-area" id="player-0">
      <div class="status-badge" id="name-0">You (Hero)</div>
      <div class="cards" id="cards-0"></div>
      <div class="chips">Chips: $<span id="chips-0">1000</span></div>
      <div class="bet">Bet: $<span id="bet-0">0</span></div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <button id="btn-deal" class="btn">New Hand</button>
      <button id="btn-fold" class="btn" disabled>Fold</button>
      <button id="btn-check" class="btn" disabled>Check</button>
      <button id="btn-call" class="btn" disabled>Call</button>
      
      <div id="raise-group">
        <input type="number" id="raise-amount" min="20" step="10" value="40" />
        <button id="btn-raise" class="btn" disabled>Bet / Raise</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
