<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Suite - Poker & Blackjack</title>
  <!-- PeerJS Library for Multiplayer Poker -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Switcher -->
  <div class="game-nav">
    <button id="nav-poker" class="active" onclick="switchGame('poker')">Texas Hold'em (Multiplayer)</button>
    <button id="nav-blackjack" onclick="switchGame('blackjack')">Single Player Blackjack</button>
  </div>

  <!-- ==================== POKER SECTION ==================== -->
  <div id="poker-section">
    <div class="panel">
      <h2>Texas Hold'em Poker (PeerJS Multiplayer)</h2>
      <p style="margin-top: 5px; color: #ccc;">Host a room or join a friend's Peer ID to play multiplayer Texas Hold'em.</p>
    </div>

    <!-- PeerJS Connection Lobby -->
    <div class="panel poker-lobby">
      <div>
        <label>Your Peer ID: </label>
        <strong id="poker-my-id">Connecting...</strong>
      </div>
      <div style="margin-left: auto; display: flex; gap: 8px;">
        <input type="text" id="poker-peer-input" placeholder="Enter Host Peer ID">
        <button id="poker-btn-connect">Connect to Host</button>
        <button id="poker-btn-host">Start Game (Host)</button>
      </div>
    </div>

    <!-- Poker Table View -->
    <div class="poker-table">
      <h3>Community Cards</h3>
      <div id="poker-community-cards" class="cards" style="justify-content: center;"></div>
      <div style="margin-top: 15px;">Pot: <strong id="poker-pot-val">$0</strong></div>

      <!-- Player Seats -->
      <div id="poker-players-container" class="poker-players"></div>
    </div>

    <!-- Poker Action Controls -->
    <div class="panel">
      <div id="poker-status-msg" style="margin-bottom: 10px; font-weight: bold;">Waiting for players to join...</div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="poker-btn-fold" disabled>Fold</button>
        <button id="poker-btn-check" disabled>Check / Call</button>
        <button id="poker-btn-raise" disabled>Raise</button>
        <input type="number" id="poker-raise-input" value="50" min="10" step="10" style="width: 80px;">
      </div>
    </div>
  </div>

  <!-- ==================== BLACKJACK SECTION ==================== -->
  <div id="blackjack-section" style="display: none;">
    <div class="panel">
      <div>Chips Balance: <span id="bj-chips" style="color: #ffb703; font-weight: bold;">$10,000</span></div>
      <div id="bj-message" style="margin-top: 5px; font-weight: bold;">Place your bet and press Deal!</div>
    </div>

    <div class="panel">
      <h3>Dealer's Hand</h3>
      <div id="bj-dealer-score" style="margin: 5px 0;">Dealer Shows: 0</div>
      <div id="bj-dealer-cards" class="cards"></div>

      <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">

      <h3>Your Hands</h3>
      <div id="bj-player-hands"></div>
    </div>

    <div class="panel" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <label for="bj-bet-input">Bet Amount: </label>
      <input type="number" id="bj-bet-input" value="100" min="10" step="10" style="width: 90px;">
      <button id="bj-btn-deal">Deal</button>
      <button id="bj-btn-hit" disabled>Hit</button>
      <button id="bj-btn-stand" disabled>Stand</button>
      <button id="bj-btn-double" disabled>Double Down</button>
      <button id="bj-btn-split" disabled>Split</button>
      <button id="bj-btn-insurance" disabled>Insurance</button>
    </div>
  </div>

  <!-- View Switcher Script -->
  <script>
    function switchGame(mode) {
      const pokerEl = document.getElementById('poker-section');
      const bjEl = document.getElementById('blackjack-section');
      const navPoker = document.getElementById('nav-poker');
      const navBj = document.getElementById('nav-blackjack');

      if (mode === 'poker') {
        pokerEl.style.display = 'block';
        bjEl.style.display = 'none';
        navPoker.classList.add('active');
        navBj.classList.remove('active');
      } else {
        pokerEl.style.display = 'none';
        bjEl.style.display = 'block';
        navBj.classList.add('active');
        navPoker.classList.remove('active');
      }
    }
  </script>

  <!-- External JavaScript Files -->
  <script src="blackjack.js"></script>
  <script src="game.js"></script>
</body>
</html>
