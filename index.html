<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Texas Hold'em</title>
  <link rel="stylesheet" href="style.css?v=3">
  <!-- PeerJS Library for WebRTC P2P Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- Room Setup Modal Overlay -->
  <div id="lobby-modal">
    <div class="lobby-box">
      <h2>Texas Hold'em P2P</h2>
      <p>Play live with friends across different computers!</p>
      
      <div class="input-group">
        <label>Your Name:</label>
        <input type="text" id="player-name-input" placeholder="Enter name" value="Player">
      </div>

      <hr>

      <div class="lobby-actions">
        <button id="btn-create-room" class="btn lg">Create New Room</button>
        <div class="or-divider">OR</div>
        <input type="text" id="join-code-input" placeholder="Enter Room Code">
        <button id="btn-join-room" class="btn lg secondary">Join Room</button>
      </div>

      <div id="lobby-status"></div>
    </div>
  </div>

  <!-- Poker Table -->
  <div id="poker-table">
    <div id="room-info-bar">
      <span>ROOM CODE: <strong id="display-room-code">------</strong></span>
      <button id="btn-copy-code" class="btn-sm">Copy Code</button>
    </div>

    <!-- Opponents Area -->
    <div id="opponents-container"></div>

    <!-- Table Center -->
    <div id="table-center">
      <div id="pot-container">
        <div id="pot-label">POT: $<span id="pot-amount">0</span></div>
      </div>
      <div id="community-cards"></div>
      <div id="message-board">Connecting to lobby...</div>
    </div>

    <!-- Hero Player Area -->
    <div class="player-area hero-area" id="hero-area">
      <div class="status-badge" id="hero-name">You</div>
      <div class="cards" id="hero-cards"></div>
      <div class="chips">Chips: $<span id="hero-chips">1000</span></div>
      <div class="bet">Bet: $<span id="hero-bet">0</span></div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <button id="btn-deal" class="btn" disabled>Start Hand (Host Only)</button>
      <button id="btn-fold" class="btn" disabled>Fold</button>
      <button id="btn-check" class="btn" disabled>Check</button>
      <button id="btn-call" class="btn" disabled>Call</button>
      
      <div id="raise-group">
        <input type="number" id="raise-amount" min="20" step="10" value="40" />
        <button id="btn-raise" class="btn" disabled>Bet / Raise</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=3"></script>
</body>
</html>
